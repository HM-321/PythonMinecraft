name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-client:
    name: Windows Client
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Check Python
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build
        run: |
          python -m PyInstaller --clean --noconfirm MinecraftBuildWindows.spec

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -Recurse -Filter "*.exe" |
            Where-Object { $_.Name -eq "MinecraftBuild.exe" } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "MinecraftBuild.exe was not found."
            Get-ChildItem -Path "dist" -Recurse
            exit 1
          }

          Write-Host "Found: $($exe.FullName)"

          $packageDir = Split-Path $exe.FullName -Parent

          Compress-Archive `
            -Path "$packageDir\*" `
            -DestinationPath "MinecraftBuild-Windows.zip" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBuild-Windows
          path: MinecraftBuild-Windows.zip


  build-windows-server:
    name: Windows Server
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Check Python
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build
        run: |
          python -m PyInstaller --clean --noconfirm MinecraftBuildServer.spec

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -Recurse -Filter "MinecraftBuildServer.exe" |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "MinecraftBuildServer.exe was not found."
            Get-ChildItem -Path "dist" -Recurse
            exit 1
          }

          Write-Host "Found: $($exe.FullName)"

          $packageDir = Split-Path $exe.FullName -Parent

          Compress-Archive `
            -Path "$packageDir\*" `
            -DestinationPath "MinecraftBuildServer-Windows.zip" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBuildServer-Windows
          path: MinecraftBuildServer-Windows.zip


  build-macos-client:
    name: macOS Client
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python
        run: python3 --version

      - name: Upgrade pip
        run: python3 -m pip install --upgrade pip

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Build
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Package
        run: |
          test -d "dist/MinecraftBuild/MinecraftBuild.app"

          ditto -c -k --sequesterRsrc --keepParent \
            "dist/MinecraftBuild/MinecraftBuild.app" \
            "MinecraftBuild-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBuild-macOS
          path: MinecraftBuild-macOS.zip


  build-macos-server:
    name: macOS Server
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python
        run: python3 --version

      - name: Upgrade pip
        run: python3 -m pip install --upgrade pip

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Build server app
        run: |
          rm -rf \
            build/MinecraftBuildServer \
            dist/MinecraftBuildServer \
            dist/MinecraftBuildServer.app

          python3 -m PyInstaller \
            --clean \
            --noconfirm \
            --windowed \
            --name MinecraftBuildServer \
            --add-data "Template.json:." \
            server.py

          test -d "dist/MinecraftBuildServer.app"

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/MinecraftBuildServer.app" \
            "MinecraftBuildServer-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBuildServer-macOS
          path: MinecraftBuildServer-macOS.zip


  release:
    name: Create GitHub Release

    needs:
      - build-windows-client
      - build-windows-server
      - build-macos-client
      - build-macos-server

    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show release assets
        run: |
          echo "=== Release assets ==="
          find release-assets -maxdepth 2 -type f -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes